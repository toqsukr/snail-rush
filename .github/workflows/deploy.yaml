name: Deploy to Hosting

on:
  push:
    branches:
      - master

env:
  REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
  REMOTE_USER: ${{ secrets.REMOTE_USER }}
  PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to hosting
        run: |
          test -n "$PUBLIC_HOST" || { echo "PUBLIC_HOST variable is not set"; exit 1; }
          ssh "$REMOTE_USER@$REMOTE_HOST" PUBLIC_HOST="$PUBLIC_HOST" bash -s <<'REMOTE'
          set -e
          docker network inspect snail >/dev/null 2>&1 || docker network create snail
          cd /root/snail-rush
          git pull origin master
          printf 'PUBLIC_HOST=%s\n' "$PUBLIC_HOST" > .env
          docker compose up --build -d
          docker image prune -f
          docker builder prune -f --filter until=72h
          REMOTE
